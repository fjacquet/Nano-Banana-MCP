name: Docs
on:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  docs:
    uses: fjacquet/ci/.github/workflows/web-deploy.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      node-version: "24"
      build-script: "docs:build"
      build-dir: "docs/.vitepress/dist"
