# OSV-Scanner ignore list.
#
# Everything with a published fix is patched via the `overrides` block in
# package.json. Only advisories with no viable upgrade path are waived below,
# with the reason and a re-check date.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-27
reason = "brace-expansion@2.1.2 DoS via unbounded expansion. No fixed release exists on the 2.x line, and 5.0.8 changed the CJS entry point from a default callable to a named { expand } export, so consumers that do require('brace-expansion') and call the result directly — minimatch@9 here — break under an override. It is reached only through glob/rimraf file-deletion helpers (@google/genai > google-auth-library > gaxios > rimraf > glob > minimatch@9, and the jest reporter chain in devDependencies); the glob patterns those pass in are library constants, never MCP client input. The override is held at ^2.1.2, which does clear GHSA-3jxr-9vmj-r5cp. Re-check when minimatch publishes a line that consumes brace-expansion 5.x."
